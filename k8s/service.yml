apiVersion: v1
kind: Service
metadata:
  name: web-app-service
  namespace: production
spec:
  type: NodePort
  selector:
    app: web-app
    version: blue  # Starts pointing to 'blue'. Ansible switches this to 'green'.
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5678
      nodePort: 30080
