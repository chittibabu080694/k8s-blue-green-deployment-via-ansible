apiVersion: v1
kind: Service
metadata:
  name: web-app-service
  namespace: production
spec:
  type: ClusterIP # Or LoadBalancer / NodePort depending on your cluster setup
  selector:
    app: web-app
    version: blue  # This will be toggled dynamically by Ansible during switchover
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
