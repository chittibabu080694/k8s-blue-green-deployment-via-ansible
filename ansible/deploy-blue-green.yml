---
- name: Deploy Blue-Green Application on Minikube via Ansible
  hosts: localhost
  gather_facts: no
  vars:
    # Set to 'blue' or 'green' to switch traffic
    target_version: "green" 

  tasks:
    - name: Ensure Kubernetes namespace exists
      kubernetes.core.k8s:
        state: present
        src: "../k8s/namespace.yml"

    - name: Deploy Blue application version
      kubernetes.core.k8s:
        state: present
        src: "../k8s/app-blue.yml"

    - name: Deploy Green application version
      kubernetes.core.k8s:
        state: present
        src: "../k8s/app-green.yml"

    - name: Switch service selector traffic to the target version
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: web-app-service
            namespace: production
          spec:
            selector:
              app: web-app
              version: "{{ target_version }}"
